[project]
name = "cribl-plays-doom"
version = "0.2.0"
description = "Doom played by decision models (Cribl Decision 1.0, Jev, heuristics): structured state in, one button out"
requires-python = ">=3.11,<3.14"
dependencies = ["vizdoom>=1.3.0", "python-dotenv>=1.0", "numpy>=1.26"]

[project.optional-dependencies]
# Cribl Decision 1.0 via PyTorch + PEFT (CUDA, Apple MPS or CPU). This is the
# reference path: the LoRA stays unmerged exactly as published.
cribl = ["torch>=2.6", "transformers>=5.19", "peft>=0.21", "huggingface_hub>=1.0",
         "accelerate>=1.0", "safetensors>=0.5"]
# Faster path on Apple Silicon: LoRA merged once into the base, run with MLX.
mlx = ["mlx>=0.32", "mlx-lm>=0.32"]
# Jev, via TypeSafe's own SDK. Needs TYPESAFE_API_KEY.
jev = ["typesafe-sdk>=0.6"]
# Recording gameplay to mp4. imageio-ffmpeg bundles its own ffmpeg binary, so
# there is nothing to install system-wide.
record = ["imageio[ffmpeg]>=2.34", "pillow>=10"]
test = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["doom_agent", "cribl_decision", "cribl_mlx"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
